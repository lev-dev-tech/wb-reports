name: Обновить отчет

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Собрать и зашифровать данные
        env:
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          if [ -z "$WB_API_TOKEN" ]; then
            echo "Токена WB пока нет - публикую демо-данные"
            node scripts/build.mjs --demo
          else
            node scripts/build.mjs
          fi
      - name: Сообщить о сбое в Telegram
        if: failure()
        env:
          ALERT_BOT_TOKEN: ${{ secrets.ALERT_BOT_TOKEN }}
          ALERT_CHAT_ID: ${{ secrets.ALERT_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$ALERT_BOT_TOKEN" ] || [ -z "$ALERT_CHAT_ID" ]; then exit 0; fi
          curl -s -o /dev/null "https://api.telegram.org/bot${ALERT_BOT_TOKEN}/sendMessage"             --data-urlencode "chat_id=${ALERT_CHAT_ID}"             --data-urlencode "text=Сайт отчетов WB не обновился: ${RUN_URL}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

